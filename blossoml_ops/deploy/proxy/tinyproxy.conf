# /etc/tinyproxy/tinyproxy.conf  (I4: allowlisted egress for the blossoml-ops user)
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 120
MaxClients 20
LogLevel Info
Syslog On
Allow 127.0.0.1
# Only CONNECT to 443 (HTTPS and wss://).
ConnectPort 443
Filter "/etc/tinyproxy/blossoml-ops.filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off
DisableViaHeader Yes
