name: Deploy blossoml-ops

# Like blossoML: a v* tag builds and deploys. CI deploys the application only;
# users, ACLs, sudoers, the firewall, the proxy and systemd units are set up by
# hand (blossoml_ops/deploy/README.md) and cannot be changed from here.
#
# The runtime is a conda environment (Python + Spot from conda-forge + the app),
# built here on the production architecture and packed with conda-pack. The
# server only unpacks it: no pip, no network, no build tools.
#
# Repository variables (Settings > Variables):
#   PROD_RUNNER  runner with the production CPU architecture
#                (ubuntu-24.04 for x86_64, ubuntu-24.04-arm for aarch64)
#   PROD_PYTHON  Python minor version for the runtime env, e.g. "3.12"
# Secrets: OPS_SSH_KEY, OPS_HOST, OPS_USER

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    # Spot is required everywhere now (rules are translated at runtime), so tests run in a conda env.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ops
          create-args: >-
            -c conda-forge
            python=${{ vars.PROD_PYTHON || '3.12' }}
            spot>=2.14
            pip
      - name: Install
        run: pip install -e ./ltlguard -e './blossoml_ops[test]'
      - name: ltlguard tests (incl. differential tests against Spot)
        run: cd ltlguard && python -m pytest -q
      - name: blossoml-ops tests (incl. output guard and NIP-44 vectors)
        run: cd blossoml_ops && python -m pytest -q
      - name: Rules translate with Spot
        run: python -m ltlguard check blossoml_ops/blossoml_ops/rules.yaml

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.PROD_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pack
          create-args: -c conda-forge conda-pack
      - name: Build the runtime environment (Python, Spot, dependencies, the app)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          micromamba create -y -p "$PWD/runtime" -c conda-forge \
            "python=${{ vars.PROD_PYTHON || '3.12' }}" "spot>=2.14" pip
          ./runtime/bin/python -m pip install --no-cache-dir ./ltlguard ./blossoml_ops
          ./runtime/bin/python -m ltlguard check blossoml_ops/blossoml_ops/rules.yaml
          mkdir -p dist
          conda-pack -p "$PWD/runtime" -o dist/env.tar.gz --ignore-missing-files
          echo "$VERSION" > dist/VERSION
          cd dist
          sha256sum env.tar.gz VERSION > SHA256SUMS
          tar -cf "../blossoml-ops-${VERSION}.tar" env.tar.gz VERSION SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: blossoml-ops-*.tar

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.OPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload
        run: |
          scp -i ~/.ssh/deploy_key blossoml-ops-*.tar blossoml_ops/deploy/remote-install.sh \
            "${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }}:/opt/blossoml-ops/incoming/"
      - name: Install (selfcheck, then switch `current`)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.OPS_USER }}@${{ secrets.OPS_HOST }}" \
            "bash /opt/blossoml-ops/incoming/remote-install.sh /opt/blossoml-ops/incoming/blossoml-ops-${GITHUB_REF_NAME}.tar"
